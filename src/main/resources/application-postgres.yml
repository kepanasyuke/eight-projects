server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/eight
    username: eight
    password: eight
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 12
      pool-name: eight-pg-pool
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.hibernate.SQL: debug
