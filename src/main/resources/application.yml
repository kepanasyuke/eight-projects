server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true

spring:
  application:
    name: eight-projects
  datasource:
    url: jdbc:h2:mem:eight;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      pool-name: eight-pool
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

eight:
  broker:
    retry-max-attempts: 3
    retry-delay-ms: 50
    outbox-poll-interval-ms: 1000
    outbox-batch-size: 20
  crypto:
    keystore: classpath:crypto/demo-keystore.p12
    keystore-password: changeit
    key-alias: eight-demo
    key-password: changeit
  websocket:
    max-text-message-bytes: 8192
    send-time-limit-ms: 10000
    buffer-size-bytes: 16384
  concurrency:
    pool-size: 8
    queue-capacity: 64
    task-timeout-ms: 1200

logging:
  level:
    root: info
    ru.multitool.eight: info
    org.hibernate.SQL: warn
