  <text x="52" y="230" font-family="'Cascadia Code', 'Cascadia Mono', Consolas, monospace" font-size="9" font-weight="400" fill="#565c66">{ id, title, status }</text>
  <text x="316" y="100" font-family="'Cascadia Code', 'Cascadia Mono', Consolas, monospace" font-size="9" font-weight="400" fill="#0067c0">Idempotency-Key</text>
