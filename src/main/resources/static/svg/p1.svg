  <text x="362" y="132" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#15181c">сервер</text>
  <text x="362" y="150" font-family="'Cascadia Code', 'Cascadia Mono', Consolas, monospace" font-size="9" font-weight="400" fill="#565c66">controller</text>
  <line x1="140" y1="143" x2="340" y2="143" stroke="url(#line-p1)" stroke-width="2"/>
