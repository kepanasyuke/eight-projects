<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="REST API">
  <title>REST API</title>
  <defs>
    <pattern id="grid-p1" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="rgba(120, 160, 210, 0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow-p1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line-p1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="blur-p1" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="480" height="270" fill="#0b1220"/>
  <rect width="480" height="270" fill="url(#grid-p1)"/>
  <circle cx="392" cy="64" r="86" fill="url(#glow-p1)">
    <animate attributeName="r" values="78;92;78" dur="6s" repeatCount="indefinite"/>
  </circle>
  <rect x="0.5" y="0.5" width="479" height="269" fill="none" stroke="#38bdf8" stroke-opacity="0.35"/>
  <text x="22" y="34" font-family="Inter, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#e6eefc">REST API</text>
  <text x="22" y="54" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="11" fill="#93a4c0">POST /api/v1/work-items</text>
  <line x1="22" y1="64" x2="458" y2="64" stroke="#38bdf8" stroke-opacity="0.3"/>
  <rect x="36" y="112" width="96" height="62" rx="8" fill="rgba(18, 27, 43, 0.85)" stroke="#38bdf8" stroke-opacity="0.45"/>
  <rect x="348" y="112" width="96" height="62" rx="8" fill="rgba(18, 27, 43, 0.85)" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="50" y="136" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="10" fill="#93a4c0">клиент</text>
  <text x="362" y="136" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="10" fill="#93a4c0">сервер</text>
  <line x1="140" y1="143" x2="340" y2="143" stroke="url(#line-p1)" stroke-width="2"/>
  <circle r="6" fill="#38bdf8">
    <animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M140,143 L340,143"/>
  </circle>
  <circle r="6" fill="#38bdf8" opacity="0.5">
    <animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M340,166 L140,166"/>
  </circle>
  <circle r="6" fill="#38bdf8">
    <animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M140,143 L340,143"/>
  </circle>
  <circle r="6" fill="#38bdf8" opacity="0.5">
    <animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M340,166 L140,166"/>
  </circle>
  <circle r="6" fill="#38bdf8">
    <animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M140,143 L340,143"/>
  </circle>
  <circle r="6" fill="#38bdf8" opacity="0.5">
    <animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M340,166 L140,166"/>
  </circle>
  <rect x="196" y="166" width="128" height="30" rx="8" fill="rgba(18, 27, 43, 0.85)" stroke="#38bdf8" stroke-opacity="0.3"/>
  <text x="206" y="186" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#a7f3d0">201 Created</text>
  <rect x="196" y="166" width="128" height="30" rx="8" fill="none" stroke="#38bdf8">
    <animate attributeName="stroke-opacity" values="0.2;0.9;0.2" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="60" y="196" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="9" fill="#93a4c0">{ id, title, status }</text>
  <text x="60" y="210" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="9" fill="#93a4c0">{ id, title, status }</text>
  <text x="60" y="224" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="9" fill="#93a4c0">{ id, title, status }</text>
  <text x="60" y="238" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="9" fill="#93a4c0">{ id, title, status }</text>
  <text x="252" y="100" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="9" fill="#38bdf8">Idempotency-Key</text>
</svg>
