<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="REST API">
  <title>REST API</title>
  <defs>
    <linearGradient id="bg-p1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f8fa"/>
      <stop offset="100%" stop-color="#e2e7ee"/>
    </linearGradient>
    <linearGradient id="line-p1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0067c0" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#0067c0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0067c0" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="sh-p1" x="-14%" y="-18%" width="128%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.6" flood-color="#1a2129" flood-opacity="0.30"/>
    </filter>
  </defs>
  <rect width="480" height="270" fill="url(#bg-p1)"/>
  <circle cx="404" cy="52" r="92" fill="#0067c0" fill-opacity="0.09"/>
