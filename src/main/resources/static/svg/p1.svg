  <text x="22" y="53" font-family="'Cascadia Code', 'Cascadia Mono', Consolas, monospace" font-size="11" fill="#565c66">POST /api/v1/work-items</text>
  <rect x="22" y="63" width="436" height="1" fill="#dfe4eb"/>
  <rect x="22" y="63" width="34" height="2" rx="1" fill="#0067c0" fill-opacity="0.85"/>
  <rect x="36" y="112" width="96" height="62" rx="8" fill="#ffffff" stroke="#0067c0" stroke-opacity="0.55" filter="url(#sh-p1)"/>
