<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="многопоточность">
  <title>многопоточность</title>
  <defs>
    <pattern id="grid-p4" width="24" height="24" patternUnits="userSpaceOnUse">
