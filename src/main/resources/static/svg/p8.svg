<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="WebSocket">
  <title>WebSocket</title>
  <defs>
    <pattern id="grid-p8" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="rgba(120, 160, 210, 0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow-p8" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line-p8" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#fb7185" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="blur-p8" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="480" height="270" fill="#0b1220"/>
  <rect width="480" height="270" fill="url(#grid-p8)"/>
  <circle cx="392" cy="64" r="86" fill="url(#glow-p8)">
    <animate attributeName="r" values="78;92;78" dur="6s" repeatCount="indefinite"/>
  </circle>
  <rect x="0.5" y="0.5" width="479" height="269" fill="none" stroke="#fb7185" stroke-opacity="0.35"/>
  <text x="22" y="34" font-family="Inter, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#e6eefc">WebSocket</text>
  <text x="22" y="54" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="11" fill="#93a4c0">/ws/state</text>
  <line x1="22" y1="64" x2="458" y2="64" stroke="#fb7185" stroke-opacity="0.3"/>
  <rect x="40" y="104" width="112" height="40" rx="8" fill="rgba(18, 27, 43, 0.85)" stroke="#fb7185" stroke-opacity="0.4"/>
  <text x="52" y="129" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="10" fill="#e6eefc">NEW</text>
  <rect x="184" y="104" width="112" height="40" rx="8" fill="rgba(18, 27, 43, 0.85)" stroke="#fb7185" stroke-opacity="0.4"/>
