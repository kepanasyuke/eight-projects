  <line x1="152" y1="124" x2="184" y2="124" stroke="url(#line-p8)" stroke-width="2"/>
  <line x1="296" y1="124" x2="340" y2="124" stroke="url(#line-p8)" stroke-width="2"/>
  <circle r="5" fill="#fb7185">
    <animateMotion dur="3s" begin="0.0s" repeatCount="indefinite" path="M96,124 L184,124"/>
  </circle>
  <circle r="5" fill="#fb7185">
    <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M240,124 L340,124"/>
  </circle>
  <rect x="240" y="104" width="112" height="40" rx="8" fill="none" stroke="#fb7185" stroke-width="2">
